name: SSO Build and Test

on:
  push:
    paths:
      - "digitechhub-sso/**"
      - ".github/workflows/sso-build.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('digitechhub-sso/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          cd digitechhub-sso
          ./mvnw clean install -DskipTests

      - name: Run Tests with Maven
        run: |
          cd digitechhub-sso
          ./mvnw test

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso-test-results
          path: digitechhub-sso/target/surefire-reports

      - name: Archive Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sso-build-artifacts
          path: digitechhub-sso/target/*.jar

      - name: Get Current Time
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: "YYYY-MM-DD HH:mm:ss"
          utcOffset: "+09:00"

      - name: Log Completion Time
        run: echo "Build and tests completed at ${{ steps.current-time.outputs.time }}"
        shell: bash
