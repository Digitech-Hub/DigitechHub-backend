# 전역 플러그인
plugins:
  # Rate Limiting
  - name: rate-limiting
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  # Request Size Limiting
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false

  # Request Transformer
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Forwarded-By: kong"
          - "X-Gateway: digitechhub"
