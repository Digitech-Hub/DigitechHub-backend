_format_version: "3.0"
_transform: true

# 서비스 정의
services:
  # SSO 서비스
  - name: sso-service
    host: digitechhub-sso
    port: 8080
    protocol: http
    path: /
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    routes:
      - name: sso-auth-route
        strip_path: false
        paths:
          - /api/auth
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        protocols:
          - http
          - https
      - name: sso-swagger-route
        strip_path: false
        paths:
          - /api/auth/docs
        methods:
          - GET
        protocols:
          - http
          - https
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - X-Auth-Token
            - Authorization
          exposed_headers:
            - X-Auth-Token
          credentials: true
          max_age: 3600

  # Equipment 서비스
