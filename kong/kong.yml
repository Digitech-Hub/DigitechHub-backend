_format_version: "3.0"
_transform: true

services:
  # 통합 Swagger UI
  - name: swagger-aggregator
    host: swagger-aggregator
    port: 80
    protocol: http
    routes:
      - name: swagger-ui-root
        paths:
          - /docs
          - /docs/
        strip_path: false
        preserve_host: false
        regex_priority: 1
      
      - name: swagger-ui-assets
        paths:
          - ~/docs/.*
        strip_path: false
        preserve_host: false
        regex_priority: 0

  # SSO Service
  - name: sso-service
    host: digitechhub-sso
    port: 8080
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    routes:
      - name: sso-api
        paths:
          - /api/auth
        strip_path: false
        preserve_host: false
      
      - name: sso-docs
        paths:
          - /api/auth/docs
          - /api/auth/docs/*
          - /api/auth/swagger-ui
          - /api/auth/swagger-ui/*
        strip_path: false
        preserve_host: false

  # Equipment Service
  - name: equipment-service
    host: digitechhub-equipment
    port: 3001
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    routes:
      - name: equipment-api
        paths:
          - /api/equipments
        strip_path: false
        preserve_host: false
      
      - name: equipment-docs
        paths:
          - /api/equipments/docs
        strip_path: false
        preserve_host: false

  # Meal Service
  - name: meal-service
    host: digitechhub-meal
    port: 3000
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    routes:
      - name: meal-api
        paths:
          - /api/meals
        strip_path: false
        preserve_host: false
      
      - name: meal-docs
        paths:
          - /api/meals/docs
        strip_path: false
        preserve_host: false

  # Timetable Service
  - name: timetable-service
    host: digitechhub-timetable
    port: 3002
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 5
    routes:
      - name: timetable-api
        paths:
          - /api/timetables
        strip_path: false
        preserve_host: false
      
      - name: timetable-docs
        paths:
          - /api/timetables/docs
        strip_path: false
        preserve_host: false

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
      require_content_length: false

  - name: request-transformer
    config:
      add:
        headers:
          - "X-Forwarded-By:kong"
          - "X-Gateway:digitechhub"